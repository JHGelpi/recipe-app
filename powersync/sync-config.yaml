# What each device receives. Each stream MIRRORS an RLS select policy;
# change one, change the other (CLAUDE.md rule 6).
config:
  edition: 3

streams:
  # Mirrors recipes_select: household_id = auth_household_id().
  household_recipes:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, title, servings, prep_minutes, cook_minutes,
             ingredients, steps, tags, notes, source_url, source_author, source_text,
             photo_id,
             created_at, updated_at, updated_by, deleted_at
      FROM recipes
      WHERE household_id = auth.parameter('household_id')

  # Mirrors favorites_select: the user's own rows. RLS on write keeps a
  # user's rows inside their household, so the user filter is enough.
  user_favorites:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, user_id, recipe_id,
             created_at, updated_at, updated_by, deleted_at
      FROM favorites
      WHERE user_id = auth.user_id()

  # Mirrors imports_select: household_id = auth_household_id(), narrowed to
  # rows not dismissed, so a dismissed or saved import leaves the phone.
  household_imports:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, source_type, source_text, source_url, status, draft,
             error, parse_started_at, recipe_id,
             created_at, updated_at, updated_by, deleted_at
      FROM imports
      WHERE household_id = auth.parameter('household_id') AND deleted_at IS NULL

  # Mirrors photos_select: household_id = auth_household_id(), narrowed to
  # rows not deleted, so dismissed and replaced photos leave the phone.
  household_photos:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, kind, import_id, position, recipe_id, media_type,
             bytes, width, height, uploaded_at,
             created_at, updated_at, updated_by, deleted_at
      FROM photos
      WHERE household_id = auth.parameter('household_id') AND deleted_at IS NULL

  # Mirrors substitutions_select: household_id = auth_household_id(), narrowed
  # to rows not deleted.
  household_substitutions:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, recipe_id, ingredient_id, ingredient_raw, options, note,
             created_at, updated_at, updated_by, deleted_at
      FROM substitutions
      WHERE household_id = auth.parameter('household_id') AND deleted_at IS NULL

  # Mirrors memberships_select's household branch.
  household_members:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, user_id, email, role, created_at
      FROM memberships
      WHERE household_id = auth.parameter('household_id') AND deleted_at IS NULL

  # Mirrors memberships_select's own-row branch. Keyed by user, so it keeps
  # arriving after a change of household; the phone refreshes on a change.
  my_membership:
    auto_subscribe: true
    query: >-
      SELECT id, household_id, user_id, email, role, created_at
      FROM memberships
      WHERE user_id = auth.user_id() AND deleted_at IS NULL

  # Mirrors households_select.
  household_info:
    auto_subscribe: true
    query: >-
      SELECT id, name FROM households WHERE id = auth.parameter('household_id')
