name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.5
      - run: pip install ansible-core ansible-lint
      - run: pnpm test:infra

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds every image, so a broken Dockerfile fails the pull request.
      - name: Build and start the stack
        run: pnpm dev:backend:test
      - run: pnpm db:seed
      - run: pnpm test:stack
      - run: pnpm test:rls
      - run: pnpm test:api
      - run: pnpm test:prod-config
      - run: pnpm test:backup
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile dev logs --tail 200

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start the stack
        run: pnpm dev:backend:test
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile dev logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
