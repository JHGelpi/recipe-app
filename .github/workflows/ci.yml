name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (issue #69): CI only reads the repository. Actions are
# pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical advisories in production dependencies fail CI. Known
      # build-only ones are listed in package.json pnpm.auditConfig (ADR-0029).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.5
      - run: pip install ansible-core ansible-lint
      - run: pnpm test:infra

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds every image, so a broken Dockerfile fails the pull request.
      - name: Build and start the stack
        run: pnpm dev:backend:test
      - run: pnpm db:seed
      - run: pnpm test:stack
      - run: pnpm test:rls
      - run: pnpm test:api
      - run: pnpm test:prod-config
      - run: pnpm test:backup
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile dev logs --tail 200

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start the stack
        run: pnpm dev:backend:test
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile dev logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
