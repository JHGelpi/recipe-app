# The whole stack. The same file runs locally and on the production host;
# only the values in .env differ. `--profile dev` adds the mail catcher.
name: recipe-app

services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: ['postgres', '-c', 'wal_level=logical']
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm env:init}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?run pnpm env:init}
      API_LOGIN_PASSWORD: ${API_LOGIN_PASSWORD:?run pnpm env:init}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?run pnpm env:init}
      POWERSYNC_REPL_PASSWORD: ${POWERSYNC_REPL_PASSWORD:?run pnpm env:init}
      POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:?run pnpm env:init}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only: for the test suites and psql on this machine.
      - '127.0.0.1:${DB_HOST_PORT:-54329}:5432'
    healthcheck:
      # Over TCP on purpose: the first-boot init server listens only on the
      # socket, so this stays unhealthy until init has finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d app']
      interval: 2s
      timeout: 5s
      retries: 60

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/app
      DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run pnpm env:init}
      GOTRUE_JWT_KEYS: ${JWT_KEYS:-[]}
      # 10 minutes: bounds what a removed person's phone can still sync (ADR-0015).
      GOTRUE_JWT_EXP: 600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      # 8 digits: the sign-in screen, its check in SessionProvider and the test
      # mail readers expect this length; change them together.
      GOTRUE_MAILER_OTP_LENGTH: 8
      # Sign-in codes last 10 minutes. The email (deploy/email-templates/otp.html)
      # and the sign-in screen both say so: change all three together.
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Dishkept sign-in code
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your Dishkept sign-in code
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://proxy:8080/email-templates/otp.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://proxy:8080/email-templates/otp.html
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Dishkept}
      GOTRUE_SMTP_MAX_FREQUENCY: ${AUTH_EMAIL_MAX_FREQUENCY:-60s}
      # The OTP, verify and refresh limits below count per address, and GoTrue
      # skips them unless told which header holds it. The proxy sets this one
      # on /auth/*; never X-Forwarded-For, whose leftmost value the client picks.
      GOTRUE_RATE_LIMIT_HEADER: X-Client-IP
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT:-30}
      GOTRUE_RATE_LIMIT_OTP: ${AUTH_RATE_LIMIT:-30}
      GOTRUE_RATE_LIMIT_VERIFY: ${AUTH_RATE_LIMIT:-30}
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: ${AUTH_RATE_LIMIT:-30}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: 'true'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/custom_access_token_hook
      # Production spec §4: the sign-up gate; off until signup_settings.gate_on.
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: 'true'
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/before_user_created_hook
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9999/health']
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      # GoTrue creates auth.users, which our migration references.
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@db:5432/app?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
    command:
      - --no-dump-schema
      - --migrations-dir
      - /db/migrations
      # Kept out of the public schema so the RLS coverage guard sees only our tables.
      - --migrations-table
      - dbmate.schema_migrations
      - migrate

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgres://api_login:${API_LOGIN_PASSWORD}@db:5432/app
      JWT_JWKS_URL: http://auth:9999/.well-known/jwks.json
      JWT_AUDIENCE: authenticated
      # AI (ADR-0005, ADR-0012). Empty key: imports fail with ai_unavailable.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_MODEL_PARSE: ${LLM_MODEL_PARSE:-claude-sonnet-5-5}
      LLM_PRICE_INPUT_PER_MTOK_USD: ${LLM_PRICE_INPUT_PER_MTOK_USD:-2}
      LLM_PRICE_OUTPUT_PER_MTOK_USD: ${LLM_PRICE_OUTPUT_PER_MTOK_USD:-10}
      AI_MONTHLY_CAP_USD: ${AI_MONTHLY_CAP_USD:-2}
      # FR-45: in-app feedback is filed as GitHub issues. A fine-grained token
      # scoped to Issues (read and write) on this repository only. Empty: the
      # app says feedback isn't set up.
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-JHGelpi/recipe-app}
    volumes:
      # Photo files (ADR-0013). Back up with the database.
      - photos:/data/photos

  sync:
    image: journeyapps/powersync-service:1.27.0
    restart: unless-stopped
    command: ['start', '-r', 'unified']
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      # The migration creates the publication the service replicates from.
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_SOURCE_URI: postgresql://powersync_repl:${POWERSYNC_REPL_PASSWORD}@db:5432/app
      PS_STORAGE_URI: postgresql://powersync_storage:${POWERSYNC_STORAGE_PASSWORD}@db:5432/powersync_storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/probes/liveness').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      LAN_HTTPS_HOST: ${LAN_HTTPS_HOST:-localhost}
      CORS_DEV_ORIGIN: ${CORS_DEV_ORIGIN:-http://cors-disabled.invalid}
      # Who may set X-Forwarded-*: only this host in dev; the tunnel's network in production.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - '${PROXY_PORT:-8080}:8080'
      - '${LAN_HTTPS_PORT:-8443}:8443'
    volumes:
      # A bind mount, not a named volume, so `down -v` (db:reset) keeps the
      # private CA and phones that trust it.
      - ./.local/caddy:/data
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 2s
      timeout: 5s
      retries: 30

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/New_York}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ALERT_TO: ${BACKUP_ALERT_TO:-}
      # The build the proxy serves, recorded in each backup's manifest (prod:deploy sets it).
      BUILD_TIME: ${BUILD_TIME:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Dishkept}
      # FR-46: the alert's logo and footer link point at the public address.
      PUBLIC_URL: ${PUBLIC_URL}
      # rclone's GCS remote, named "offsite", from the environment.
      RCLONE_CONFIG_OFFSITE_TYPE: 'google cloud storage'
      RCLONE_CONFIG_OFFSITE_SERVICE_ACCOUNT_FILE: /run/secrets/gcs.json
      RCLONE_CONFIG_OFFSITE_BUCKET_POLICY_ONLY: 'true'
      # The service account may only create and read objects, not inspect or create buckets.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: 'true'
    volumes:
      # Read-write: a restore replaces the files. Back up with the database (ADR-0013).
      - photos:/data/photos
      - backups:/backups

  mail:
    image: axllent/mailpit:v1.31.5
    profiles: [dev]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAIL_HOST_PORT:-8025}:8025'

volumes:
  db_data:
  photos:
  backups:
