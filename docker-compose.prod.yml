# Production (production spec §2): `docker compose` + this file, project
# dishkept, .env.production. Only the scripts in scripts/prod run it.
services:
  db:
    ports: !reset []
  auth:
    environment:
      # Issue #61. The email budget is one counter for the whole site, so it
      # must stay above what one address can send. GoTrue lets an address make
      # 30 code requests at once, then GOTRUE_RATE_LIMIT_OTP per 5 minutes:
      # at 2 that is at most 54 in its first hour and 24 an hour after, under
      # 60. Verify and refresh keep AUTH_RATE_LIMIT (10 per 5 minutes).
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT_EMAIL:-60}
      GOTRUE_RATE_LIMIT_OTP: ${AUTH_RATE_LIMIT_OTP:-2}
  proxy:
    ports: !reset []
    environment:
      # The tunnel connector is on the Docker network.
      TRUSTED_PROXIES: private_ranges
    volumes: !override
      - caddy_data:/data
  backup:
    volumes:
      - ${GCS_KEY_FILE:-./.local/gcs-backup-key.json}:/run/secrets/gcs.json:ro
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    profiles: [tunnel]
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env.production}
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  caddy_data:
