<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Bundled fonts have one weight each: never fake bold over them. -->
    <style>
      body {
        font-synthesis: none;
      }
    </style>
    <!-- viewport-fit=cover lets the app fill the screen around the iPhone notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Dishkept</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS takes the home-screen icon from this tag, not the manifest. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Browser tabs and bookmarks: the small icon, and a sharp one for large tiles. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0E121A" />
    <meta name="color-scheme" content="dark" />
    <!-- The saved appearance, or the system's, before anything paints (ADR-0020).
         Plain ES5; the app keeps it in step from here (src/theme/useAppearance.ts). -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        // Apart, so blocked storage still leaves the system's theme.
        try {
          var saved = localStorage.getItem('dishkept.appearance');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var bg = { dark: '#0E121A', light: '#F6F7F9' }[theme];
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', bg);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute('content', theme);
      })();
    </script>
    <!-- "black", not "black-translucent": translucent draws the page under the
         iPhone's clock and Dynamic Island. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Dishkept" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The theme's background, so nothing else shows before the app draws.
         The values match src/theme/palettes.ts (indexHtml.test.ts). */
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #0e121a;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background-color: #f6f7f9;
      }
      /* Keyboard focus is always visible: the theme's accent (UI spec §2). */
      :focus-visible {
        outline: 2px solid var(--accent, #00f5d4);
        outline-offset: 2px;
      }
      /* Text fields show focus with their own mint border instead. */
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
