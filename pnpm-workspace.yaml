packages:
  - apps/*
  - packages/*
# Install scripts are declined explicitly; an undecided one fails the install
# in Docker. esbuild's binary comes from its @esbuild/<platform> package.
allowBuilds:
  # core-js (from jsPDF) only prints a donation message on install.
  core-js: false
  esbuild: false
# Issue #69: advisories in Expo's build tooling, fixed within the same major.
overrides:
  node-forge@<1.4.1: ^1.4.1
  # react-native-worklets accepts any version and pnpm picked 0.87.1; React
  # Native 0.88's CLI wants its own. Native tooling only; move with react-native.
  '@react-native/metro-config': 0.88.1
# Known advisories that `pnpm audit` in CI ignores (ADR-0029). Each is in
# build-time tooling only, with no fix inside its major yet; recheck when
# Expo updates. GHSA-mrhx-c7xc-m3w5: zod 3 in @expo/cli (memory exhaustion).
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
