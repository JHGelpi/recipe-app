# The PC serves only while Podman brings the stack back after a reboot (ADR-0033;
# RUNBOOK "Keep the PC serving"). scripts/podman/setup-host.sh sets this up.
- name: Check Podman's restart setup and the start-at-boot task
  ansible.builtin.shell: |
    set -eo pipefail
    systemctl --user is-enabled podman-restart.service podman.socket
    test -f ~/.config/systemd/user/podman-restart.service.d/unless-stopped.conf
    loginctl show-user "$USER" -p Linger | grep -qx Linger=yes
    /mnt/c/Windows/System32/schtasks.exe /query /tn 'Dishkept Podman'
  args:
    executable: /bin/bash
  register: serve_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Warn if production won't come back after a reboot
  ansible.builtin.debug:
    msg: >-
      WARNING: production may not come back after a reboot. Run scripts/podman/setup-host.sh
      and create the "Dishkept Podman" scheduled task (RUNBOOK "Keep the PC serving").
  when: serve_check.rc != 0
